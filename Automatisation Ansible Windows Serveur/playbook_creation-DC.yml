---
- name: Installation d'un Domain Controller (DC)
  hosts: windowsserver
  gather_facts: false

  pre_tasks:
    - name: Création de l'utilisateur admin
      ansible.windows.win_user:
        name: admin
        password: P@Zerty&123-
        state: present

    - name:  Fixation de l'adresse IP du DNS
      ansible.windows.win_dns_client:
        adapter_names: '*'
        dns_servers:
          - 192.168.80.18
          - 192.168.152.129

    - name: Changement du hostname du serveur AD
      ansible.windows.win_hostname:
        name: dc0
      register: res

    - name: Redémarrer si c'est requis
      ansible.windows.win_reboot:
      when: res.reboot_required

  tasks:
    - name: Installation de l'Active Directory (AD)
      ansible.windows.win_feature:
        name: AD-Domain-Services 
        state: present
        include_sub_features: true
        include_management_tools: true
      register: win_feature_ad

    - name: Redémarrage si la fonctionnalité AD le requiert
      ansible.windows.win_reboot:
      when: win_feature_ad.reboot_required

    - name: Installation du DNS 
      ansible.windows.win_feature:
        name: DNS 
        state: present
        include_sub_features: true
        include_management_tools: true
      register: win_feature_dns

    - name: Redémarrage si la fonctionnalité DNS le requiert
      ansible.windows.win_reboot:
      when: win_feature_dns.reboot_required

    - name: Creation d'un nouveau domaine et une forêt 
      microsoft.ad.domain:
        create_dns_delegation: false
        database_path: C:\Windows\NTDS
        dns_domain_name: balebawilfried.lan
        domain_mode: Win2012R2
        domain_netbios_name: BALEBAWILFRIED
        forest_mode: Win2012R2
        safe_mode_password: password123!
        sysvol_path: C:\Windows\SYSVOL
      register: domain_install

    - name: Redémarrer le serveur si la création du nouveau domaine et de la forêt le requiert
      ansible.windows.win_reboot:
        msg: "Le serveur a redémarré ..."
      when: domain_install.reboot_required