---
  - name: Creation d'unités organisationnelles
    microsoft.ad.ou:
      name: "{{ item }}"
      state: present
    loop:
      - INFORMATIQUE
      - DEP_INFO
      - COMMERCIAL
  
  - name: Création d'un nouveau groupe nommé informatique
    microsoft.ad.group:
      name: informatique
      description: Deploiement du groupe informatique
      state: present

  - name: Création d'un nouveau groupe nommé dep_info
    microsoft.ad.group:
      name: dep_info
      description: Deploiement du groupe dep_info
      state: present
    

 


  